  <title>中国共产党廉洁自律准则</title>

  <header class="doc-head">
    <div class="emblem">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">

    <div class="org">招商积余湖北公司智慧党建云平台</div>
    <h1>中国共产党廉洁自律准则</h1>
    <div class="meta">（发布：2015-10-22）</div>
  </header>

  <main class="doc-body">
    <div class="doc-card">
      <p class="lead">中国共产党廉洁自律准则</p>
<p>第一条 坚持公私分明，先公后私，克己奉公。</p>
<p>第二条 坚持崇廉拒腐，清白做人，干净做事。</p>
<p>第三条 坚持尚俭戒奢，艰苦朴素，勤俭节约。</p>
<p>第四条 坚持吃苦在前，享受在后，甘于奉献。</p>
<p>党员领导干部廉洁自律规范</p>
<p>第五条 廉洁从政，自觉保持人民公仆本色。</p>
<p>第六条 廉洁用权，自觉维护人民根本利益。</p>
<p>第七条 廉洁修身，自觉提升思想道德境界。</p>
<p>第八条 廉洁齐家，自觉带头树立良好家风。</p>
      <p class="doc-source">来源：共产党员网（12371.cn）</p>
    </div>
  </main>
