name: 同步思想理论

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）自动同步一次
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 抓取并生成 theory.json
        run: node scripts/sync-theory.js

      - name: 有更新则提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add theory.json
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "chore: 同步思想理论栏目（$(date +%Y-%m-%d)）"
            git push
          fi
